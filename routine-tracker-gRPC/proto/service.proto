syntax = "proto3";
package habits;

import "habit.proto";

option go_package = "github.com/itsfarhan/routine-tracker";

// Habits is the gRPC service for registering and tracking habits.
service Habits {
  // CreateHabit registers a new habit.
  rpc CreateHabit(CreateHabitRequest) returns (CreateHabitResponse);
}

message CreateHabitRequest {
  // Name of the new habit. Cannot be empty.
  string name = 1;
  // Weekly target. Defaults to 1 if omitted.
  optional int32 weekly_frequency = 2;
}

message CreateHabitResponse {
  Habit habit = 1;
}