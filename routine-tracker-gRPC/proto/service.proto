syntax = "proto3";
package habit;
import "habit.proto";
option go_package = "github.com/itsfarhan/routine-tracker/api";

service Habits {
  rpc CreateHabit(CreateHabitRequest) returns (CreateHabitResponse);
  rpc ListHabits(ListHabitsRequest)   returns (ListHabitsResponse);   // add in 10.5
  rpc TickHabit(TickHabitRequest)     returns (TickHabitResponse);    // add in 10.7
}

message CreateHabitRequest {
  string name = 1;
  optional int32 weekly_frequency = 2;
}
message CreateHabitResponse { Habit habit = 1; }

message ListHabitsRequest {}
message ListHabitsResponse { repeated Habit habits = 1; }  // repeated = slice

message TickHabitRequest  { string habit_id = 1; }
message TickHabitResponse {}   // empty on purpose — can grow later